version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: crm-redis
    ports:
      - "6379:6379"
    restart: always

  api:
    build: .
    container_name: crm-api
    ports:
      - "3000:3000"
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    restart: always
